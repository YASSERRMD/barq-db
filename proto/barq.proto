syntax = "proto3";

package barq;

service Barq {
  rpc Status (StatusRequest) returns (StatusResponse);
  rpc CreateCollection (CreateCollectionRequest) returns (CreateCollectionResponse);
  rpc Insert (InsertRequest) returns (InsertResponse);
  rpc Search (SearchRequest) returns (SearchResponse);

  // Legacy RPCs kept temporarily while SDKs migrate to the canonical contract.
  rpc Health (HealthRequest) returns (HealthResponse);
  rpc InsertDocument (InsertDocumentRequest) returns (InsertDocumentResponse);
  rpc BatchSearch (BatchSearchRequest) returns (BatchSearchResponse);
}

message StatusRequest {}

message StatusResponse {
  bool ok = 1;
  string version = 2;
}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
  string version = 2;
}

message CreateCollectionRequest {
  string name = 1;
  uint32 dimension = 2;
  string metric = 3;
}

message CreateCollectionResponse {
  bool success = 1;
}

message InsertRequest {
  string collection = 1;
  string id = 2;
  repeated float vector = 3;
  string payload_json = 4;
}

message InsertResponse {
  bool success = 1;
}

message InsertDocumentRequest {
  string collection = 1;
  string id = 2;
  repeated float vector = 3;
  string payload_json = 4;
}

message InsertDocumentResponse {
  bool success = 1;
}

message SearchRequest {
  string collection = 1;
  repeated float vector = 2;
  uint32 top_k = 3;
}

message SearchResult {
  string id = 1;
  float score = 2;
  string payload_json = 3;
}

message SearchResponse {
  repeated SearchResult results = 1;
}

message SearchQuery {
  repeated float vector = 1;
  string filter_json = 2;
}

message BatchSearchRequest {
  string collection = 1;
  repeated SearchQuery queries = 2;
  uint32 top_k = 3;
}

message QueryResults {
  repeated SearchResult hits = 1;
}

message BatchSearchResponse {
  repeated QueryResults results = 1;
}
